services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
    ports:
      - "5432:5432"
    volumes:
      - folio-postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/folio
      DB_USERNAME: folio
      DB_PASSWORD: folio
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  folio-postgres:
