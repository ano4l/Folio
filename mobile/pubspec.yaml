name: folio_mobile
description: "Folio - student financial document vault and AI assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  file_picker: ^8.1.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  table_calendar: ^3.1.3
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^10.1.3
  pinput: ^5.0.0
  flutter_markdown_plus: 1.0.12
  url_launcher: ^6.3.2
  archive: 4.0.9
  xml: 6.6.1
  pdf: 3.12.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/folio-app-icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/OFL.txt
