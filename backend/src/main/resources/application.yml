server:
  port: ${PORT:8080}

spring:
  application:
    name: folio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/folio}
    username: ${DB_USERNAME:folio}
    password: ${DB_PASSWORD:folio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

folio:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  auth:
    otp-minutes: ${AUTH_OTP_MINUTES:10}
    session-hours: ${AUTH_SESSION_HOURS:12}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    otp-pepper: ${AUTH_OTP_PEPPER:change-this-in-production}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Folio <onboarding@resend.dev>}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemma-4-31b-it:free}
    site-url: ${OPENROUTER_SITE_URL:http://localhost:3000}
    app-name: ${OPENROUTER_APP_NAME:Folio}
    zero-data-retention: ${OPENROUTER_ZDR:true}
